<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduControl - Sistema Integral de Gestión Educativa</title>
    <meta name="description" content="Sistema de gestión escolar web multiplataforma con módulos de alumnos, docentes, calificaciones, asistencias, pagos, horarios, comunicados, reportes PDF/Excel y seguridad." />
    <meta property="og:title" content="EduControl - Sistema Integral de Gestión Educativa" />
    <meta property="og:description" content="Sistema de gestión escolar web multiplataforma con módulos de alumnos, docentes, calificaciones, asistencias, pagos, horarios, comunicados, reportes PDF/Excel y seguridad." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(val) {
              _origFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(e) {
          if (
            (e && e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e && e.message && e.message.indexOf('fetch of #<Window>') !== -1)
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && e.reason.message) || String((e && e.reason) || '');
          var stack = (e && e.reason && e.reason.stack) || '';
          if (msg.indexOf('fetch of #<Window>') !== -1 || stack.indexOf('chrome-extension://') !== -1) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
